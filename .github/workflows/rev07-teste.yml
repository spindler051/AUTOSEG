name: AUTOSEG REV07 - verificacoes do branch de teste

on:
  push:
    branches:
      - 'teste/**'
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Compilacao dos modulos alterados
        run: |
          python -m py_compile produtividade_os.py gmail_service.py prestadores_ext.py atendimento_os.py portal_prestador.py portal_v9.py servidor_web.py
      - name: Testes de produtividade em banco temporario
        run: python -m unittest -v test_produtividade_rev07
