# Este workflow valida exclusivamente o codigo existente na main (baseline v9.4.1).
# NAO homologa a REV06_DEV nem a REV07; essas revisoes alteram fluxos e exigem suites proprias.
name: AUTOSEG main - validacao da v9.4.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autosseg-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias da main
        run: python -m pip install -r requirements.txt
      - name: Compilar arquivos Python da main
        run: python -m compileall -q .
      - name: Regressao da v9.4.1 (somente main, banco temporario)
        run: python test_v94_correcoes.py
