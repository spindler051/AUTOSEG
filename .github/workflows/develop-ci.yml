name: AUTOSEG DEV - qualidade e versionamento

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoseg-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar metadados de versao
        run: python officina/core/versionador.py verificar
      - name: Compilar codigo Python
        run: python -m compileall -q officina flavors tests workaholic/src
      - name: Suite completa
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Validar JavaScript do portal
        run: node --check flavors/autoseg/web/portal.js
